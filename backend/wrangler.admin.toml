# The administration API, deployed apart from the public one.
#
# Same source tree, different entry point. The reason for a second Worker is
# the session cookie: neither deployment sets a Domain on its cookie, so the
# admin session only ever travels to admin-api.luma-studio.tw and a script
# running on the storefront cannot reach it.
#
# Deploy with:  uv run pywrangler deploy -c wrangler.admin.toml
# Secrets are per-Worker. GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and
# GOOGLE_OAUTH_REDIRECT_URI have to be set on this Worker too; the copies on
# the public Worker are not shared with it.

name = "luma-studio-admin-api"
main = "src/admin_main.py"
compatibility_date = "2026-07-21"
compatibility_flags = ["python_workers"]

[observability]
enabled = true
head_sampling_rate = 1

# The same database as the public Worker. This deployment is the only one that
# applies migrations — see router.serve — so deploy it before the other.
[[d1_databases]]
binding = "DB"
database_name = "luma-ibon-cache"
database_id = "07d2f14a-1cb8-4b0e-bdb7-db76e3ffc98b"

# Uploads, folder management and bio-link avatars all write here.
[[r2_buckets]]
binding = "IBON_IMAGES"
bucket_name = "luma-ibon-images"

[[r2_buckets]]
binding = "COURSE_SOURCE"
bucket_name = "luma-course-source"

[[r2_buckets]]
binding = "COURSE_VIDEO"
bucket_name = "luma-course-video"

# What the desktop tool downloads: the pinned FFmpeg, its corresponding source,
# and later the installers. Its own bucket rather than a prefix in the video one,
# because the playback gateway reads that bucket and the fewer things in there
# that are not video, the fewer ways its key allowlist can be wrong.
[[r2_buckets]]
binding = "DESKTOP_TOOLS"
bucket_name = "luma-desktop-tools"

# Every attempt writes an oauth state row before the visitor has proved
# anything, and the D1 write quota is shared with the session table: hammering
# this endpoint is how you lock the owner out of their own back office.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The installer and its update metadata, which are public: an updater looks for
# a new build before anybody has signed into anything. Tens of megabytes an
# answer, so it gets a limit rather than nothing — and its own namespace, so an
# update storm cannot spend the login limiter's budget.
#
# Generous, because an updater fetching `latest.yml`, a blockmap and an installer
# is three requests in a row and two admins may install at once.
[[ratelimits]]
name = "RELEASE_LIMITER"
namespace_id = "1007"
simple = { limit = 60, period = 60 }

[vars]
# Only the back office talks to this Worker. The storefront origins are
# deliberately absent: nothing served from luma-studio.tw has any business
# sending a credentialed request here.
ALLOWED_ORIGINS = "https://admin.luma-studio.tw"
FRONTEND_ORIGIN = "https://admin.luma-studio.tw"

# Getting a video in: creating an asset, handing out presigned URLs, and
# registering a verified encode. On because this is a back-office capability
# rather than something being sold — it is here so it can be turned off during
# an incident without a deploy, not because it is unfinished.
#
# Unset is off. A Worker that has not been told to accept uploads will refuse
# them, which is why this line has to exist rather than being assumed.
VIDEO_UPLOAD_ENABLED = "1"

# A presigned URL needs the bucket's name in the path. The R2 binding above
# gives this Worker an object it can read and write, but not what the bucket is
# called, so the names appear twice on purpose.
COURSE_SOURCE_BUCKET = "luma-course-source"
COURSE_VIDEO_BUCKET = "luma-course-video"

# What storage costs, for the overview's estimate. Configuration rather than a
# constant in the program: R2's prices change, and a number nobody remembers to
# look at reads exactly like an accurate one. Unset means the overview shows no
# estimate at all, which is the honest answer when nobody has said what a
# gigabyte costs.
R2_PRICE_PER_GB_MONTH_USD = "0.015"
R2_FREE_GB = "10"

# The S3-compatible endpoint for this account, from R2's settings. Not a
# secret — it is in every signed URL — but it is account-specific, so it lives
# here rather than in the code.
#
# Fill in the account id before deploying. Left blank, every presign answers
# 503 rather than handing out a URL that only fails once it reaches R2.
R2_S3_ENDPOINT = "https://f1f2129c93f208cbd521a77bc777b360.r2.cloudflarestorage.com"

# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are secrets and are deliberately
# absent from this file:
#
#   npx wrangler secret put R2_ACCESS_KEY_ID --config wrangler.admin.toml
#   npx wrangler secret put R2_SECRET_ACCESS_KEY --config wrangler.admin.toml
#
# Only this Worker has them. The public Worker signs nothing, and the desktop
# tool is given short-lived URLs rather than a key of its own.
