name = "luma-studio"
main = "src/main.py"
compatibility_date = "2026-07-21"
compatibility_flags = ["python_workers"]

[observability]
enabled = true
head_sampling_rate = 1

# Replace the database_id after: uv run pywrangler d1 create luma-ibon-cache
[[d1_databases]]
binding = "DB"
database_name = "luma-ibon-cache"
database_id = "07d2f14a-1cb8-4b0e-bdb7-db76e3ffc98b"

[[r2_buckets]]
binding = "IBON_IMAGES"
bucket_name = "luma-ibon-images"

# Per-IP limits on the routes an outsider can reach. Budgets are generous
# enough that a person clicking around never notices, and small enough that a
# script cannot spend the shared D1 write quota or the ibon upload path.
# See backend/src/rate_limit.py for what each one guards.
#
# The admin sign-in limiter is not here: /auth/login moved to
# backend/wrangler.admin.toml along with the rest of administration, so a
# flood aimed at the storefront can no longer eat the owner's login budget.

# A cache miss reads up to 15 MB from R2 and runs the four-step ibon upload.
[[ratelimits]]
name = "PRINT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# The bio link page and its click redirects: two D1 reads and at most one
# deduplicated write per visitor per day.
[[ratelimits]]
name = "PUBLIC_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# One R2 read per request. Generous, because a classroom shares one address
# and the admin's thumbnail grid fetches eight images at once.
[[ratelimits]]
name = "ASSET_LIMITER"
namespace_id = "1004"
simple = { limit = 240, period = 60 }

# The catalogue. A product page is several D1 reads rather than one, and
# someone browsing a shop clicks far more often than someone reading a bio
# link page, so this sits between the two.
[[ratelimits]]
name = "SHOP_LIMITER"
namespace_id = "1006"
simple = { limit = 180, period = 60 }

# Same reasoning as the admin's sign-in limit: every attempt writes an oauth
# state row before the visitor has proved anything. Looser, because a shop has
# many customers where the back office has one owner.
[[ratelimits]]
name = "CUSTOMER_LOGIN_LIMITER"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

# Checkout decrements stock and writes to four tables. Nobody legitimately
# places ten orders a minute, and a script that tries would be taking items
# off the shelf for fifteen minutes at a time.
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

# Unpaid orders hold their stock for fifteen minutes. Sweeping every five
# means an abandoned checkout frees the item within twenty at worst, which is
# short enough that the last one in stock is not lost for an afternoon.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Marks an order paid with no gateway involved. Development only — the route
# answers 404 unless this is exactly "1", and production must never set it.
# It exists so the order lifecycle can be exercised before PAYUNi is wired up.
ALLOW_FAKE_PAYMENT = "0"
# ibon's ordinary web-upload flow. The Worker creates a fresh web-entry
# bootstrap payload for every cache miss.
IBON_PRINT_API_BASE_URL = "https://print-api.ibon.com.tw/api"
IBON_UPLOAD_API_BASE_URL = "https://www.ibon.com.tw/qwsapi2/api"
IBON_CLIENT_VERSION = "4.2.4"
IBON_GUEST_EMAIL = "guest@qware.com.tw"

# Browser origins allowed to send credentialed requests to this API. The
# session cookie is SameSite=Lax and these origins share a site with the API,
# so this list is the CSRF defence and the OAuth redirect allowlist. Never add
# a localhost origin here: any process on that port would gain credentialed
# write access to production. For local work, use backend/.dev.vars instead.
#
# The admin origin is deliberately absent. It talks to the admin Worker, and
# listing it here would let the back office send credentialed requests to the
# public API for no reason anyone needs.
ALLOWED_ORIGINS = "https://luma-studio.tw,https://www.luma-studio.tw"
# Where the already-shared /ibon_print/{id} links send browsers.
FRONTEND_ORIGIN = "https://luma-studio.tw"
