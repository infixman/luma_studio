name: Deploy Luma Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: luma-studio-production
  cancel-in-progress: false

permissions:
  contents: read

# Four things are deployed, but there are only two real dependencies: the
# schema has to exist before anything reads it, and an API has to exist before
# the pages that call it. That is a line, not a graph.
#
# Within a job the order is ordinary step order, which is easier to read than
# a `needs:` web and costs nothing — the two Workers share a source tree and a
# token, so splitting them would only buy a second cold environment.
jobs:
  backend:
    name: Deploy backend Workers
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: backend

      # In the same job as the deploys it gates, so nothing has to remember
      # that some other job was supposed to have run it.
      - name: Test
        run: uv run pytest
        working-directory: backend

      # The admin Worker owns the D1 schema, so the migrations it applies have
      # to be in place before the public Worker — which never applies one —
      # meets the database.
      - name: Deploy admin API
        run: uv run pywrangler deploy -c wrangler.admin.toml
        working-directory: backend

      - name: Deploy public API
        run: uv run pywrangler deploy
        working-directory: backend

  frontend:
    name: Deploy web sites
    runs-on: ubuntu-latest
    environment: production
    # Both sites call an API that has to be answering first.
    needs: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      # Typechecks once and builds both sites. Their API URLs come from
      # .env.production and .env.admin rather than from here: the two builds
      # need different values, and one shell variable feeding both is how the
      # back office ends up quietly pointed at the public API.
      - name: Build
        run: npm run build
        working-directory: frontend

      # The back office first, so the storefront's /admin redirect has
      # somewhere to land the moment it ships.
      - name: Deploy back office
        run: npx wrangler deploy -c wrangler.admin.jsonc
        working-directory: frontend

      - name: Deploy storefront
        run: npx wrangler deploy
        working-directory: frontend
