name: Deploy Luma Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: luma-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: backend
      - name: Test
        run: uv run pytest
        working-directory: backend
      - name: Deploy Worker
        run: uv run pywrangler deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    name: Deploy web interface
    runs-on: ubuntu-latest
    environment: production
    # The API must exist before the pages that call it go live.
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL || 'https://api.luma-studio.tw' }}
      - name: Deploy static assets
        run: npx wrangler deploy
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
