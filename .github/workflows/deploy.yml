name: Deploy Luma Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: luma-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admin-backend:
    name: Deploy admin API Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: backend
      - name: Test
        run: uv run pytest
        working-directory: backend
      # First of the four. This deployment owns the D1 schema, so the
      # migrations it applies have to be in place before anything that reads
      # them goes live.
      - name: Deploy Worker
        run: uv run pywrangler deploy -c wrangler.admin.toml
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  backend:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    environment: production
    # The public Worker never applies a migration, so it must not be the first
    # thing to meet a database the admin Worker has not brought up to date.
    needs: admin-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: backend
      - name: Deploy Worker
        run: uv run pywrangler deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  admin-frontend:
    name: Deploy back office
    runs-on: ubuntu-latest
    environment: production
    # The admin API must exist before the pages that call it go live.
    needs: admin-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      # The API URLs come from frontend/.env.admin, not from here. The two
      # builds need different values, and a shell variable feeding both is how
      # the back office would end up pointed at the public API.
      - name: Build
        run: npm run typecheck && npm run build:admin
        working-directory: frontend
      - name: Deploy static assets
        run: npx wrangler deploy -c wrangler.admin.jsonc
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    name: Deploy storefront
    runs-on: ubuntu-latest
    environment: production
    # Last: it forwards /admin to the back office, which should already be
    # answering by the time anyone follows that redirect.
    needs: [backend, admin-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run typecheck && npm run build:storefront
        working-directory: frontend
      - name: Deploy static assets
        run: npx wrangler deploy
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
