name: Back up D1

on:
  schedule:
    # 19:10 UTC is 03:10 in Taipei — after the day's edits, before anyone works.
    - cron: "10 19 * * *"
  workflow_dispatch:

concurrency:
  group: luma-studio-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Export to R2
    runs-on: ubuntu-latest
    environment: production
    env:
      # A token of its own: this job reads the whole database, which the
      # deploy token has no reason to be able to do, and the deploy token's
      # ability to publish Workers is no use here.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # admin_sessions and admin_oauth_states hold live credentials, and
      # ibon_print_cache expires within a day. Backing any of them up would
      # store secrets for no recovery value.
      #
      # Everything else the shop owns has to be listed here as it arrives. The
      # completeness check below iterates this same variable, so a table left
      # out is not caught — the backup simply succeeds without it, and nobody
      # finds out until they need it.
      TABLES: >-
        bio_link_settings bio_link_items bio_link_events folder_print_settings
        products product_variants product_images shipping_methods
        product_categories product_category_links pages page_blocks
        site_settings menu_items media
        customers orders order_items payment_attempts order_audit_log
    steps:
      - uses: actions/checkout@v4

      - name: Check the credentials before doing anything
        # A wrong token and a wrong account id fail identically deep inside a
        # later step, so establish which one is at fault up front.
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_BACKUP_TOKEN is not set on the production environment"
            exit 1
          fi
          echo "account id ends with: ...${CLOUDFLARE_ACCOUNT_ID: -6}"
          npx --yes wrangler@4 whoami 2>&1 | sed 's/[0-9a-f]\{28,\}/<redacted>/g'

      - name: Export the tables worth keeping
        working-directory: backend
        # `d1 execute` rather than `d1 export`: the export endpoint rejects
        # this token with an authentication error even at D1:Edit, while the
        # query endpoint is the same one deploys already rely on.
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/backup.json"
          jq -n --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{exportedAt: $at, tables: {}}' > "$OUT"

          for TABLE in $TABLES; do
            RAW="$RUNNER_TEMP/${TABLE}.raw"
            # Both streams to one file: wrangler prints its banner and some
            # errors on stdout, and swallowing either leaves a failure with
            # nothing to diagnose.
            if ! npx --yes wrangler@4 d1 execute luma-ibon-cache \
                   --remote --json --command "SELECT * FROM ${TABLE}" > "$RAW" 2>&1; then
              echo "::error::wrangler failed while reading ${TABLE}"
              cat "$RAW"
              exit 1
            fi

            # Skip anything printed before the JSON payload.
            sed -n '/^[[{]/,$p' "$RAW" > "$RAW.json"
            if ! jq -e '.' "$RAW.json" > /dev/null 2>&1; then
              echo "::error::${TABLE} did not come back as JSON"
              cat "$RAW"
              exit 1
            fi

            jq --arg table "$TABLE" \
               --argjson rows "$(jq '[.[].results] | add // []' "$RAW.json")" \
               '.tables[$table] = $rows' "$OUT" > "$OUT.next"
            mv "$OUT.next" "$OUT"
            echo "${TABLE}: $(jq --arg t "$TABLE" '.tables[$t] | length' "$OUT") rows"
          done

      - name: Confirm the export is usable
        # A backup that turns out to be empty on the day it is needed is worse
        # than no backup, because it was trusted in the meantime.
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/backup.json"
          for TABLE in $TABLES; do
            jq -e --arg t "$TABLE" '.tables | has($t)' "$OUT" > /dev/null || {
              echo "::error::${TABLE} is missing from the export"
              exit 1
            }
          done
          jq -e '.tables.bio_link_items | length > 0' "$OUT" > /dev/null || {
            echo "::error::bio_link_items came back empty; the export is not trustworthy"
            exit 1
          }

      - name: Compress
        # JSON of a table that only grows compresses to roughly a tenth.
        run: gzip -9 "$RUNNER_TEMP/backup.json" && ls -lh "$RUNNER_TEMP/backup.json.gz"

      - name: Upload to R2
        working-directory: backend
        # The underscore prefix keeps backups outside IDENTIFIER_PATTERN, so
        # they never appear as an ibon print folder or through /images/.
        run: |
          npx --yes wrangler@4 r2 object put \
            "luma-ibon-images/_backups/$(date -u +%Y-%m-%d).json.gz" \
            --remote \
            --file "$RUNNER_TEMP/backup.json.gz" \
            --content-type "application/gzip"
