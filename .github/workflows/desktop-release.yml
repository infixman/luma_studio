name: Release desktop tool

# Publishing a release publishes the installer.
#
# A published release rather than a pushed tag: a tag can be moved and is often
# pushed mid-thought, while publishing a release is a deliberate act with a
# person behind it. Draft releases do nothing here, so the tag can exist for as
# long as it takes to write the notes.
#
# It still only does half the job, and that is on purpose. Uploading an
# installer gives it to nobody: the back office decides which version is
# current and which is the floor, and `minSupported` may only be raised once the
# installer somebody would update *to* is actually downloadable. The summary at
# the end says so, because the half that is left is the half that is easy to
# forget.
#
# The tag names the component as well as the version — `desktop-v0.1.0` — since
# the backend and the two sites live in this repository too, and `v0.1.0` alone
# would not say what it is a version of. It is also where the version *comes
# from*: the tag is stamped into package.json here, and the committed value is
# `0.0.0` on purpose. A number kept in the file is a number somebody has to
# remember to change, and the day it is not changed the release is named after
# one version and ships another.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish, e.g. 0.1.0. Required for a manual run.'
        required: true

concurrency:
  group: luma-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and publish the Windows installer
    # Other components will have their own releases in this repository. Theirs
    # must not build a desktop installer, and a run that did nothing but succeed
    # would be worse than one that never started.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    # Windows, because an NSIS installer is built by NSIS. Cross-building it from
    # Linux is possible with wine and is one more thing to be wrong about the day
    # the installer misbehaves on somebody's machine.
    runs-on: windows-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # One place decides the version, and it is the thing a person actually
      # typed. Refused rather than defaulted when it does not look like a
      # version: `desktop-latest` would otherwise publish an installer called
      # `latest`, which `latest.yml` would then point at for ever.
      - name: Work out the version
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          version="${version:-$MANUAL}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a version. Tag a release desktop-vX.Y.Z."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "publishing $version"
        env:
          TAG: ${{ github.event.release.tag_name }}
          MANUAL: ${{ inputs.version }}

      - name: Install
        working-directory: desktop
        run: npm ci

      # After `npm ci`, which checks package.json against the lockfile and would
      # refuse a version the lockfile has never seen. Before everything else,
      # because this is the number that names the installer, goes into
      # `latest.yml`, and comes back from `app.getVersion()` on the installed
      # machine — the value the version policy is compared against.
      - name: Stamp the version in
        working-directory: desktop
        # bash, like every other step here that reads a variable. The default on
        # a Windows runner is PowerShell, where `$VERSION` is one of its own
        # variables and an unset one at that — it does not fall back to the
        # environment, it fails.
        shell: bash
        run: npm pkg set version="$VERSION"

      # The same command a person runs locally: typecheck, tests, bundle, and the
      # smoke test that starts a real Electron and calls across the bridge. A
      # release that skipped it would be the one build nobody ran.
      - name: Build
        working-directory: desktop
        run: npm run build

      - name: Package
        working-directory: desktop
        # `--publish never`: electron-builder's own publishing wants a provider
        # with credentials, and ours is an R2 bucket reached with wrangler. The
        # files it writes are what gets uploaded below.
        run: npx electron-builder --win --publish never

      # Uploaded flat, matching what the Worker serves and what
      # electron-updater's generic provider expects: it reads `{feed}/latest.yml`
      # and resolves the installer's name relative to the feed. The version is in
      # the installer's own name.
      #
      # `latest.yml` goes last. Until it points at the new installer, nothing
      # offers an update — and an updater that learned about a version whose
      # installer had not finished uploading would fail on the download.
      - name: Upload the installer to R2
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*.exe dist/*.exe.blockmap; do
            [ -e "$file" ] || continue
            echo "uploading $(basename "$file")"
            npx wrangler r2 object put \
              "luma-desktop-tools/releases/$(basename "$file")" \
              --file "$file" --remote
          done

      - name: Upload the update metadata
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            luma-desktop-tools/releases/latest.yml \
            --file dist/latest.yml --content-type text/yaml --remote

      - name: Say what was published
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### 已發佈 $VERSION"
            echo
            ls dist/*.exe dist/latest.yml 2>/dev/null | sed 's/^/- /'
            echo
            echo "**還沒有人會拿到它。** 到後台 → 線上課程 → 桌面工具 → 版本政策，"
            echo "把「最新版本」改成這一版。"
            echo
            echo "要讓舊版停下來，才把「最低支援版本」也提上去 —— 但只有在上面的安裝檔"
            echo "真的下載得到之後，否則等於把人擋在一個下載不到的版本前面。"
          } >> "$GITHUB_STEP_SUMMARY"
